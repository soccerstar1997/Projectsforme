name: projectsforme

# Development stack for the Base44 preview: runs the cloned source with live
# reload (Vite dev server + node --watch), never a prebuilt bundle.
services:
  db:
    image: postgres:16
    restart: on-failure
    labels:
      base44.kind: infra
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: projectsforme
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d projectsforme"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  api:
    image: node:22
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: "Projectsforme API"
      base44.kind: api
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://app:app@db:5432/projectsforme
      - BASE44_PREVIEW_MODE
    volumes:
      - ./apps/api:/app
      - api_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec node --watch src/index.js
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/api/projects').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

  web:
    image: node:22
    restart: on-failure
    working_dir: /app
    labels:
      base44.project: "Projectsforme"
      base44.kind: web
      base44.port: 3000
    ports:
      - "3000:5173"
    environment:
      - API_URL=http://api:8000
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - BASE44_PUBLIC_HOST_SUFFIX
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - npm install --no-audit --no-fund && exec npm run dev
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 90s

volumes:
  db_data:
  api_node_modules:
  web_node_modules:
